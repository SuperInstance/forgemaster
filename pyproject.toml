[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forgemaster"
version = "0.1.0"
description = "Constraint-aware build orchestration for the SuperInstance fleet"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.urls]
Repository = "https://github.com/SuperInstance/forgemaster"

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
]

[tool.setuptools]
packages = ["forgemaster"]
