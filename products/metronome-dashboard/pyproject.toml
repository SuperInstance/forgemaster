[project]
name = "metronome-dashboard"
version = "0.1.0"
description = "Real-time terminal dashboard for fleet clock synchronization"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "rich>=13.0"]

[project.scripts]
metronome-dashboard = "metronome_dashboard.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"
